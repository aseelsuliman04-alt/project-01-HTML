<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h1>User Registration</h1>
    
    <form action="#" method="POST">
        
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" required minlength="4">
        <br><br>

        <label for="userEmail">Email Address:</label>
        <input type="email" id="userEmail" name="userEmail" required>
        <br><br>

        <label for="userPass">Password:</label>
        <input type="password" id="userPass" name="userPass" required minlength="8">
        <br><br>

        <p>Select your level:</p>
        <input type="radio" id="levelBeginner" name="level" value="beginner" required>
        <label for="levelBeginner">Beginner</label>
        <br>
        <input type="radio" id="levelAdvanced" name="level" value="advanced">
        <label for="levelAdvanced">Advanced</label>
        <br><br>

        <label for="course">Preferred Course:</label>
        <select id="course" name="course">
            <option value="html">HTML5</option>
            <option value="css">CSS3</option>
            <option value="js">JavaScript</option>
        </select>
        <br><br>

        <label for="message">Why do you want to join us?</label>
        <br>
        <textarea id="message" name="message" rows="4" cols="30"></textarea>
        <br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the terms and conditions</label>
        <br><br>

        <button type="submit">Register Account</button>

    </form>

</body>
</html>
